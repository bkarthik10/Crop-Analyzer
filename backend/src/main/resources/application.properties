# ===================== Server =====================
server.port=8080

# ===================== MySQL / JPA =====================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crop_analyzer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================== App-specific =====================
app.datasets.path=datasets/
app.models.classpath-path=models/
app.models.external-path=./ml-models/

# CORS
app.cors.allowed-origin=http://localhost:5173